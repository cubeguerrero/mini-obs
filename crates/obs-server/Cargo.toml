[package]
name = "obs-server"
version = "0.1.0"
edition = "2024"

[dependencies]
obs-proto = { path = "../obs-proto" }
obs-storage = { path = "../obs-storage" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
obs-sdk = { path = "../obs-sdk" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
