<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mini-obs · Trace Waterfall</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-hover: #1f2630;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --amber: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    header h1 span { color: var(--accent); }
    .actions { display: flex; gap: 8px; }
    button {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    button:hover { background: #30363d; }
    button.primary {
      background: #238636;
      border-color: rgba(240,246,252,0.1);
    }
    button.primary:hover { background: #2ea043; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 310px 1fr;
      overflow: hidden;
    }
    aside {
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 12px;
    }
    aside h2 {
      margin: 0 0 10px 0;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .trace-item {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 12px;
      word-break: break-all;
      background: var(--bg);
    }
    .trace-item:hover, .trace-item.active {
      border-color: var(--accent);
      background: var(--panel-hover);
    }
    .content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .summary-bar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 24px;
      font-size: 13px;
      background: rgba(22, 27, 34, 0.6);
    }
    .summary-bar strong { color: var(--accent); }
    .waterfall {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .span-row {
      display: grid;
      grid-template-columns: 340px 1fr 140px;
      align-items: center;
      gap: 12px;
      padding: 7px 10px;
      border-bottom: 1px solid rgba(48, 54, 61, 0.5);
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    .span-row:hover { background: var(--panel-hover); }
    .span-label {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .service-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
    }
    .timeline-track {
      position: relative;
      height: 18px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 3px;
      overflow: hidden;
    }
    .timeline-bar {
      position: absolute;
      top: 2px;
      bottom: 2px;
      background: var(--accent);
      border-radius: 3px;
      min-width: 3px;
    }
    .timeline-bar.error { background: var(--red); }
    .timeline-bar.bottleneck {
      box-shadow: 0 0 0 1px var(--amber);
    }
    .span-metrics {
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .self-time { color: var(--amber); font-weight: 600; }
    .details-drawer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 12px 20px;
      font-size: 12px;
      max-height: 190px;
      overflow-y: auto;
    }
    .empty {
      padding: 40px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }
    pre {
      margin: 6px 0 0 0;
      background: var(--bg);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1><span>mini-obs</span> · Distributed Trace Waterfall</h1>
    <div class="actions">
      <button onclick="loadTraces()">↻ Refresh</button>
      <button class="primary" onclick="sendDemoTrace()">+ Send Demo Trace</button>
    </div>
  </header>
  <main>
    <aside>
      <h2>Recent Traces</h2>
      <div id="trace-list"></div>
    </aside>
    <section class="content">
      <div id="summary" class="summary-bar" style="display:none"></div>
      <div id="waterfall" class="waterfall">
        <div class="empty">Select a trace on the left or click <b>+ Send Demo Trace</b> to inspect a Waterfall DAG.</div>
      </div>
      <div id="details" class="details-drawer" style="display:none"></div>
    </section>
  </main>

  <script>
    const SERVICE_COLORS = ["#58a6ff", "#bc8cff", "#3fb950", "#d29922", "#ff7b72"];
    function colorForService(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) | 0;
      return SERVICE_COLORS[Math.abs(hash) % SERVICE_COLORS.length];
    }

    async function loadTraces(selectFirst = false) {
      const res = await fetch('/api/traces');
      const ids = await res.json();
      const list = document.getElementById('trace-list');
      if (ids.length === 0) {
        list.innerHTML = '<div class="empty">No traces ingested yet.</div>';
        return;
      }
      list.innerHTML = ids.map(id => `
        <div class="trace-item" id="item-${id}" onclick="loadTraceTree('${id}')">
          <div><strong>Trace ID</strong></div>
          <div style="color:var(--muted);margin-top:3px">${id}</div>
        </div>
      `).join('');
      if (selectFirst && ids[0]) loadTraceTree(ids[0]);
    }

    function flattenTree(nodes, depth = 0, out = []) {
      for (const node of nodes) {
        out.push({ node, depth });
        if (node.children && node.children.length > 0) {
          flattenTree(node.children, depth + 1, out);
        }
      }
      return out;
    }

    async function loadTraceTree(traceId) {
      document.querySelectorAll('.trace-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`item-${traceId}`);
      if (activeEl) activeEl.classList.add('active');

      const res = await fetch(`/api/traces/${traceId}`);
      const roots = await res.json();
      const rows = flattenTree(roots);

      if (rows.length === 0) return;

      const minStart = Math.min(...rows.map(r => r.node.span.start_time_unix_nano));
      const maxEnd = Math.max(...rows.map(r => r.node.span.end_time_unix_nano));
      const totalDurationNs = Math.max(1, maxEnd - minStart);
      const maxSelfTimeNs = Math.max(...rows.map(r => r.node.self_time_ns));

      const summary = document.getElementById('summary');
      summary.style.display = 'flex';
      summary.innerHTML = `
        <div>Trace: <strong>${traceId}</strong></div>
        <div>Total Spans: <strong>${rows.length}</strong></div>
        <div>Wall Duration: <strong>${(totalDurationNs / 1e6).toFixed(2)} ms</strong></div>
        <div>Max Self-Time Bottleneck: <strong style="color:var(--amber)">${(maxSelfTimeNs / 1e6).toFixed(2)} ms</strong></div>
      `;

      const container = document.getElementById('waterfall');
      container.innerHTML = rows.map(({ node, depth }, idx) => {
        const s = node.span;
        const durNs = Math.max(0, s.end_time_unix_nano - s.start_time_unix_nano);
        const leftPct = ((s.start_time_unix_nano - minStart) / totalDurationNs) * 100;
        const widthPct = Math.max(0.6, (durNs / totalDurationNs) * 100);
        const color = colorForService(s.service_name);
        const isError = s.status !== 'ok';
        const isBottleneck = node.self_time_ns === maxSelfTimeNs;

        return `
          <div class="span-row" onclick='showDetails(${JSON.stringify(node).replace(/'/g, "&#39;")})'>
            <div class="span-label" style="padding-left:${depth * 18}px">
              <span class="service-badge" style="color:${color};border-color:${color}44;background:${color}18">${s.service_name}</span>
              <span>${s.name}</span>
            </div>
            <div class="timeline-track">
              <div class="timeline-bar ${isError ? 'error' : ''} ${isBottleneck ? 'bottleneck' : ''}"
                   style="left:${leftPct}%;width:${widthPct}%;background:${isError ? 'var(--red)' : color}"></div>
            </div>
            <div class="span-metrics">
              ${(durNs / 1e6).toFixed(2)}ms
              <span class="self-time" title="Self time">(self: ${(node.self_time_ns / 1e6).toFixed(2)}ms)</span>
            </div>
          </div>
        `;
      }).join('');

      showDetails(rows[0].node);
    }

    function showDetails(node) {
      const d = document.getElementById('details');
      d.style.display = 'block';
      const s = node.span;
      d.innerHTML = `
        <div>
          <strong>${s.service_name} → ${s.name}</strong>
          &nbsp;|&nbsp; span_id: <code>${s.span_id}</code>
          &nbsp;|&nbsp; parent_span_id: <code>${s.parent_span_id || 'None (root)'}</code>
          &nbsp;|&nbsp; self_time: <strong style="color:var(--amber)">${(node.self_time_ns / 1e6).toFixed(3)} ms</strong>
        </div>
        <pre>${JSON.stringify({ status: s.status, attributes: s.attributes }, null, 2)}</pre>
      `;
    }

    function randomHex(len) {
      return Array.from({ length: len }, () => Math.floor(Math.random() * 16).toString(16)).join('');
    }

    async function sendDemoTrace() {
      const traceId = randomHex(32);
      const rootId = randomHex(16);
      const authId = randomHex(16);
      const orderId = randomHex(16);
      const dbId = randomHex(16);
      const base = Date.now() * 1e6;

      // Intentionally send out-of-order (leaf DB span first, root span last!)
      const payload = {
        spans: [
          {
            trace_id: traceId, span_id: dbId, parent_span_id: orderId,
            service_name: "postgres", name: "INSERT INTO payments",
            start_time_unix_nano: base + 35_000_000, end_time_unix_nano: base + 110_000_000,
            status: "ok", attributes: { "db.system": "postgresql", "db.rows_affected": 1 }
          },
          {
            trace_id: traceId, span_id: authId, parent_span_id: rootId,
            service_name: "auth-service", name: "GRPC /auth.VerifyToken",
            start_time_unix_nano: base + 5_000_000, end_time_unix_nano: base + 25_000_000,
            status: "ok", attributes: { "user.id": 42, "cache.hit": true }
          },
          {
            trace_id: traceId, span_id: orderId, parent_span_id: rootId,
            service_name: "checkout", name: "POST /internal/orders",
            start_time_unix_nano: base + 28_000_000, end_time_unix_nano: base + 120_000_000,
            status: "ok", attributes: { "http.method": "POST", "cart.items": 3 }
          },
          {
            trace_id: traceId, span_id: rootId, parent_span_id: null,
            service_name: "api-gateway", name: "POST /api/checkout",
            start_time_unix_nano: base, end_time_unix_nano: base + 130_000_000,
            status: "ok", attributes: { "http.status_code": 200, "http.route": "/api/checkout" }
          }
        ]
      };

      await fetch('/v1/traces', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      await loadTraces(true);
    }

    loadTraces(true);
  </script>
</body>
</html>
